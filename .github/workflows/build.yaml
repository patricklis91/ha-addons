name: Add-on-Image bauen

on:
  push:
    branches: [main]
    paths: ["whatsapp_mcp/**", ".github/workflows/build.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'aarch64'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version aus config.yaml lesen
        id: ver
        run: |
          v=$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' whatsapp_mcp/config.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: whatsapp_mcp
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-whatsapp_mcp:${{ steps.ver.outputs.version }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          labels: |
            io.hass.version=${{ steps.ver.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
            io.hass.type=addon
